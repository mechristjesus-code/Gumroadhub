<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gumroad Creator Hub</title>
  <style>
    :root {
      --primary: #ff90e8;
      --bg: #f4f4f0;
      --card-bg: #ffffff;
      --text: #000000;
      --border: #000000;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      box-shadow: 4px 4px 0px var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background-color: var(--primary);
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gumroad Creator Hub</h1>
    <div style="text-align: center; margin-bottom: 20px;">
      <a href="creator-hub-pro.html" style="display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, var(--primary), #4a90e2); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">🚀 LAUNCH PRO HUB</a>
    </div>
    <div class="card">
      <div class="form-group">
        <label>License Key</label>
        <input type="text" id="licenseKey" placeholder="Enter your key">
      </div>
      <button id="verifyBtn">Verify</button>
    </div>
    
    <div class="card">
      <h2>Create New Product</h2>
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="productName" placeholder="Name">
      </div>
      <div class="form-group">
        <label>Price</label>
        <input type="number" id="productPrice" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="productDesc" placeholder="Description">
      </div>
      <button id="createProductBtn">Create</button>
    </div>
  </div>
  <script src="api.js"></script>
</body>
</html>
